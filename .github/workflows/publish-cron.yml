# Minute-level crons (Vercel Hobby only allows daily schedules).
# Requires repo secret CRON_SECRET matching production.
name: publish-cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger publish-due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret CRON_SECRET"
            exit 1
          fi
          BASE="${APP_URL:-https://jacita-marketing.vercel.app}"
          BASE="${BASE%/}"
          echo "Calling ${BASE}/api/cron/publish-due"
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/cron/publish-due"
          echo

      # Called on every run. The endpoint itself decides which businesses are
      # due (automation_settings.last_run_at older than ~an hour) and claims
      # each one atomically, so a late or skipped GitHub run catches up on the
      # next run and overlapping triggers (incl. the Vercel daily backup in
      # vercel.json) never run a business twice in the same hour.
      - name: Trigger automation (runs whatever is due)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          BASE="${APP_URL:-https://jacita-marketing.vercel.app}"
          BASE="${BASE%/}"
          echo "Calling ${BASE}/api/cron/automation"
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/cron/automation"
          echo
